name: Unified Collector (GitHub-first, Telegram optional)

on:
  workflow_dispatch:

concurrency:
  group: collector-run
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r config/requirements.txt

      # 主力源优先：带 GH_TOKEN 搜索 GitHub 公开仓库，先出产物
      - name: Run GitHub Collector (main source)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          RUN_MODE: frequent
          MAX_AGE_HOURS: 0.5
        run: python src/collector_git.py

      # 加分源后置：480 频道串行较慢，失败/超时不阻断主线
      - name: Run Telegram Collector (optional, non-blocking)
        continue-on-error: true
        timeout-minutes: 12
        run: python src/telegram_collector.py

      - name: Split joined proxy links
        run: |
          if [ -f all_servers.txt ]; then
            python src/split_links.py all_servers.txt
          fi

      - name: Advanced dedup configs
        run: |
          if [ -f all_servers.txt ]; then
            python src/dedup_configs.py all_servers.txt
          fi

      - name: Rebuild protocol files from cleaned all_servers.txt
        run: python src/rebuild_protocols.py

      - name: Commit and push updated files
        timeout-minutes: 5
        continue-on-error: true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          mkdir -p servers data
          touch all_servers.txt
          git add -A all_servers.txt servers/ data/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update all servers [skip ci]"
            git pull --rebase --strategy-option ours
            git push
          fi

      # 自动链式自触发默认关闭；需要持续更新时取消注释（依赖 secrets.GH_TOKEN）：
